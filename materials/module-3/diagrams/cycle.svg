<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 376" width="100%">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B5CF6"/>
    </marker>
  </defs>
  <text x="180" y="28" text-anchor="middle" font-family="Unbounded, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F1112">Цикл работы с Claude</text>

  <rect x="20" y="52" width="140" height="84" rx="12" fill="#F7F5F0" stroke="#D6D0C6" stroke-width="1.5"/>
  <text x="32" y="72" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5B33C9">01</text>
  <text x="32" y="92" font-family="Unbounded, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F1112">Описал</text>
  <text x="32" y="110" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#45433F">цель, контекст,</text>
  <text x="32" y="125" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#45433F">формат, пример</text>

  <rect x="200" y="52" width="140" height="84" rx="12" fill="#D2C2FF"/>
  <text x="212" y="72" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5B33C9">02</text>
  <text x="212" y="92" font-family="Unbounded, Arial, sans-serif" font-size="13" font-weight="700" fill="#24124A">Сделал</text>
  <text x="212" y="110" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#24124A">Claude: план,</text>
  <text x="212" y="125" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#24124A">потом версия</text>

  <rect x="200" y="196" width="140" height="84" rx="12" fill="#F7F5F0" stroke="#D6D0C6" stroke-width="1.5"/>
  <text x="212" y="216" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5B33C9">03</text>
  <text x="212" y="236" font-family="Unbounded, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F1112">Проверил</text>
  <text x="212" y="254" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#45433F">открыл, нажал,</text>
  <text x="212" y="269" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#45433F">сверил с ТЗ</text>

  <rect x="20" y="196" width="140" height="84" rx="12" fill="#FFB59A"/>
  <text x="32" y="216" font-family="IBM Plex Mono, monospace" font-size="11" fill="#24124A">04</text>
  <text x="32" y="236" font-family="Unbounded, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F1112">Уточнил</text>
  <text x="32" y="254" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#0F1112">1-3 правки</text>
  <text x="32" y="269" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#0F1112">за один раз</text>

  <line x1="162" y1="94" x2="196" y2="94" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="270" y1="138" x2="270" y2="192" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="198" y1="238" x2="164" y2="238" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="90" y1="194" x2="90" y2="140" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ar)"/>

  <circle cx="180" cy="166" r="25" fill="#24124A"/>
  <text x="180" y="166" text-anchor="middle" font-family="Unbounded, Arial, sans-serif" font-size="12" font-weight="700" fill="#F7F5F0">3–5</text>
  <text x="180" y="180" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#D2C2FF">кругов</text>

  <rect x="20" y="300" width="320" height="60" rx="12" fill="#F7F5F0" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="180" y="325" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="12" font-weight="700" fill="#5B33C9">Получилось? Запиши правило</text>
  <text x="180" y="344" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="12" fill="#45433F">в Project или CLAUDE.md — навсегда</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 284" width="100%" role="img" aria-label="Как срабатывает скилл">
<text x="16" y="30" font-family="Unbounded, Arial, sans-serif" font-size="16" fill="#0F1112" font-weight="700">Как срабатывает скилл</text>
<text x="16" y="50" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#45433F">Папка со SKILL.md, шаблонами, примерами</text>
<rect x="52" y="68" width="296" height="58" rx="12" fill="#F7F5F0" stroke="#D6D0C6" stroke-width="1"/>
<circle cx="30" cy="97" r="13" fill="#8B5CF6"/>
<text x="30" y="101.5" font-family="Unbounded, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="66" y="92" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#0F1112" font-weight="700">Claude видит 2 строки</text>
<text x="66" y="111" font-family="Golos Text, Arial, sans-serif" font-size="12" fill="#45433F">название и описание: когда применять</text>
<line x1="30" y1="112" x2="30" y2="140" stroke="#D2C2FF" stroke-width="3" stroke-linecap="round"/>
<rect x="52" y="140" width="296" height="58" rx="12" fill="#F7F5F0" stroke="#D6D0C6" stroke-width="1"/>
<circle cx="30" cy="169" r="13" fill="#8B5CF6"/>
<text x="30" y="173.5" font-family="Unbounded, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="66" y="164" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#0F1112" font-weight="700">Задача подходит</text>
<text x="66" y="183" font-family="Golos Text, Arial, sans-serif" font-size="12" fill="#45433F">«сделай КП для клиента»</text>
<line x1="30" y1="184" x2="30" y2="212" stroke="#D2C2FF" stroke-width="3" stroke-linecap="round"/>
<rect x="52" y="212" width="296" height="58" rx="12" fill="#D2C2FF"/>
<circle cx="30" cy="241" r="13" fill="#8B5CF6"/>
<text x="30" y="245.5" font-family="Unbounded, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="66" y="236" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#0F1112" font-weight="700">Открывает весь скилл</text>
<text x="66" y="255" font-family="Golos Text, Arial, sans-serif" font-size="12" fill="#45433F">шаги, правила, примеры, шаблоны</text>

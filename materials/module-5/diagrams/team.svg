<rect x="240" y="178" width="108" height="72" rx="12" fill="#D2C2FF"/>
<text x="294" y="204" font-family="Golos Text, Arial, sans-serif" font-size="13" font-weight="600" fill="#24124A" text-anchor="middle">Продажи</text>

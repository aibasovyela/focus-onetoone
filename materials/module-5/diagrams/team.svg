<text x="26" y="306" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="500" fill="#5B33C9" letter-spacing="0.5">ОБЩАЯ ПАМЯТЬ · ДЛЯ ВСЕХ</text>
<text x="26" y="326" font-family="Golos Text, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0F1112">бизнес, правила, кто за что, решения</text>

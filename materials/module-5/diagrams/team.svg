<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 358" width="100%" role="img" aria-label="Команда агентов: координатор, исполнители, общая память">
<defs><marker id="a-team" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#8B5CF6"/></marker></defs>
<rect x="110" y="12" width="140" height="36" rx="12" fill="#FFFFFF" stroke="#D6D0C6" stroke-width="1"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 458" width="100%" role="img" aria-label="Путь от идеи до боевого агента: шесть шагов">
  <rect x="0" y="0" width="360" height="458" rx="14" fill="#F7F5F0"/>
  <text x="180" y="30" text-anchor="middle" font-family="Unbounded, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F1112">От идеи до боевого агента</text>
  <text x="180" y="50" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="12" fill="#45433F">Путь, который проходим на созвоне</text>
  <line x1="32" y1="91" x2="32" y2="391" stroke="#D2C2FF" stroke-width="3"/>
  <rect x="62" y="66" width="286" height="50" rx="12" fill="#FFFFFF" stroke="#D6D0C6"/>
  <circle cx="32" cy="91" r="15" fill="#8B5CF6"/>
  <text x="32" y="96" text-anchor="middle" font-family="Unbounded, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">1</text>
  <text x="76" y="88" font-family="Golos Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F1112">Задача</text>
  <text x="76" y="105" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#45433F">одна боль, измеримый результат</text>
  <rect x="62" y="126" width="286" height="50" rx="12" fill="#FFFFFF" stroke="#D6D0C6"/>
  <circle cx="32" cy="151" r="15" fill="#8B5CF6"/>
  <text x="32" y="156" text-anchor="middle" font-family="Unbounded, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">2</text>
  <text x="76" y="148" font-family="Golos Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F1112">Прототип</text>
  <text x="76" y="165" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#45433F">роль, база знаний, 1 коннектор</text>
  <rect x="62" y="186" width="286" height="50" rx="12" fill="#FFFFFF" stroke="#D6D0C6"/>
  <circle cx="32" cy="211" r="15" fill="#8B5CF6"/>
  <text x="32" y="216" text-anchor="middle" font-family="Unbounded, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">3</text>
  <text x="76" y="208" font-family="Golos Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F1112">Тест на реальных данных</text>
  <text x="76" y="225" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#45433F">10+ кейсов, включая каверзные</text>
  <rect x="62" y="246" width="286" height="50" rx="12" fill="#FFFFFF" stroke="#D6D0C6"/>
  <circle cx="32" cy="271" r="15" fill="#8B5CF6"/>
  <text x="32" y="276" text-anchor="middle" font-family="Unbounded, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">4</text>
  <text x="76" y="268" font-family="Golos Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F1112">Границы и безопасность</text>
  <text x="76" y="285" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#45433F">права, секреты, «ок» перед отправкой</text>
  <rect x="62" y="306" width="286" height="50" rx="12" fill="#24124A"/>
  <circle cx="32" cy="331" r="15" fill="#5B33C9"/>
  <text x="32" y="336" text-anchor="middle" font-family="Unbounded, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">5</text>
  <text x="76" y="328" font-family="Golos Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Запуск</text>
  <text x="76" y="345" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#D2C2FF">один процесс, реальные данные</text>
  <rect x="62" y="366" width="286" height="50" rx="12" fill="#FFFFFF" stroke="#D6D0C6"/>
  <circle cx="32" cy="391" r="15" fill="#8B5CF6"/>
  <text x="32" y="396" text-anchor="middle" font-family="Unbounded, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">6</text>
  <text x="76" y="388" font-family="Golos Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F1112">Наблюдение</text>
  <text x="76" y="405" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#45433F">тишина при норме, алерт при сбое</text>
  <rect x="62" y="424" width="286" height="26" rx="10" fill="#FFB59A"/>
  <text x="205" y="441" text-anchor="middle" font-family="Golos Text, Arial, sans-serif" font-size="11" fill="#24124A">Сбой → правим базу или правила → снова тест</text>
</svg>

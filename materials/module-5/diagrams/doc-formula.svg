<path d="M30 316 L33 319 L38.5 312.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="50" y="320.5" font-family="Golos Text, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0F1112">реквизиты клиента правильные</text>
<rect x="12" y="348" width="336" height="60" rx="12" fill="#24124A"/>
<text x="26" y="373" font-family="Golos Text, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF">Не «сделай красивое КП»,</text>
<text x="26" y="391" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#D2C2FF">а эталон + данные. Подпись — твоя</text>

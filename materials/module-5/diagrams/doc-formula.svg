<text x="180" y="61" font-family="Golos Text, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0F1112" text-anchor="middle">Прайс</text>
<text x="180" y="80" font-family="Golos Text, Arial, sans-serif" font-size="12" fill="#45433F" text-anchor="middle">цифры, условия</text>
<text x="237" y="71" font-family="Unbounded, Arial, sans-serif" font-size="16" font-weight="600" fill="#5B33C9" text-anchor="middle">+</text>
<rect x="240" y="34" width="108" height="62" rx="12" fill="#FFFFFF" stroke="#D6D0C6" stroke-width="1"/>

<rect x="12" y="228" width="336" height="108" rx="12" fill="#FFFFFF" stroke="#FFB59A" stroke-width="1.5"/>
<text x="26" y="250" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="500" fill="#24124A" letter-spacing="0.5">ТВОЯ ПРОВЕРКА ПЕРЕД ОТПРАВКОЙ</text>
<circle cx="34" cy="272" r="8" fill="#8B5CF6"/>
<path d="M30 272 L33 275 L38.5 268.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="50" y="276.5" font-family="Golos Text, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0F1112">цены совпадают с прайсом</text>
<circle cx="34" cy="294" r="8" fill="#8B5CF6"/>
<path d="M30 294 L33 297 L38.5 290.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

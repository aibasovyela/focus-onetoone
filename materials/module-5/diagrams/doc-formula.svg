<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 412" width="100%" role="img" aria-label="Шаблон плюс данные равно документ">
<defs><marker id="a-doc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#8B5CF6"/></marker></defs>
<text x="20" y="22" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="500" fill="#5B33C9" letter-spacing="0.5">ИСХОДЯЩИЙ ДОКУМЕНТ</text>
<rect x="12" y="34" width="108" height="62" rx="12" fill="#D2C2FF"/>
<text x="66" y="61" font-family="Golos Text, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0F1112" text-anchor="middle">Шаблон</text>
<text x="66" y="80" font-family="Golos Text, Arial, sans-serif" font-size="12" fill="#45433F" text-anchor="middle">структура и тон</text>

<text x="20" y="22" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="500" fill="#5B33C9" letter-spacing="0.5">АГЕНТ В РАБОТЕ · 5+ ДНЕЙ</text>
<rect x="12" y="34" width="336" height="62" rx="12" fill="#D2C2FF"/>
<circle cx="38" cy="65" r="13" fill="#24124A"/>

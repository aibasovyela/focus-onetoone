<text x="92" y="144" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#5B33C9" letter-spacing="0.5">ОБЕЗЛИЧЬ</text>
<text x="92" y="166" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#0F1112">Таблицы с клиентами: имена →</text>

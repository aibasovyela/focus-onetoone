<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 550" width="100%" role="img" aria-label="Анатомия промпта: роль, контекст, задача, формат, ограничения">
<text x="20" y="34" font-family="Unbounded, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F1112">Анатомия промпта</text>
<text x="20" y="54" font-family="Golos Text, Arial, sans-serif" font-size="12" fill="#45433F">Пример: посты для кофейни у вуза</text>
<line x1="30" y1="107.0" x2="30" y2="502.0" stroke="#D2C2FF" stroke-width="3"/>
<rect x="52" y="72" width="296" height="70" rx="12" fill="#F7F5F0" stroke="#D6D0C6"/>
<circle cx="30" cy="107.0" r="14" fill="#8B5CF6"/>
<text x="30" y="112.0" text-anchor="middle" font-family="Unbounded, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
<text x="66" y="92" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#5B33C9" letter-spacing="0.5">РОЛЬ<tspan fill="#8C8880" font-weight="400" letter-spacing="0"> · кем быть</tspan></text>
<text x="66" y="112" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#0F1112">Ты SMM-специалист кофейни</text>
<rect x="52" y="152" width="296" height="70" rx="12" fill="#F7F5F0" stroke="#D6D0C6"/>
<circle cx="30" cy="187.0" r="14" fill="#8B5CF6"/>
<text x="30" y="192.0" text-anchor="middle" font-family="Unbounded, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
<text x="66" y="172" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#5B33C9" letter-spacing="0.5">КОНТЕКСТ<tspan fill="#8C8880" font-weight="400" letter-spacing="0"> · что за ситуация</tspan></text>
<text x="66" y="192" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#0F1112">Кофейня у вуза, гости — студенты,</text>
<text x="66" y="209" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#0F1112">запускаем раф с халвой</text>
<rect x="52" y="232" width="296" height="70" rx="12" fill="#F7F5F0" stroke="#D6D0C6"/>
<circle cx="30" cy="267.0" r="14" fill="#8B5CF6"/>
<text x="30" y="272.0" text-anchor="middle" font-family="Unbounded, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
<text x="66" y="252" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#5B33C9" letter-spacing="0.5">ЗАДАЧА<tspan fill="#8C8880" font-weight="400" letter-spacing="0"> · одно действие</tspan></text>
<text x="66" y="272" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#0F1112">Напиши 3 поста о новинке</text>
<text x="66" y="289" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#0F1112">для Instagram</text>
<rect x="52" y="312" width="296" height="70" rx="12" fill="#F7F5F0" stroke="#D6D0C6"/>
<circle cx="30" cy="347.0" r="14" fill="#8B5CF6"/>
<text x="30" y="352.0" text-anchor="middle" font-family="Unbounded, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
<text x="66" y="332" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#5B33C9" letter-spacing="0.5">ФОРМАТ<tspan fill="#8C8880" font-weight="400" letter-spacing="0"> · как выглядит ответ</tspan></text>
<text x="66" y="352" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#0F1112">До 600 знаков, крючок в начале,</text>
<text x="66" y="369" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#0F1112">призыв зайти в конце</text>
<rect x="52" y="392" width="296" height="70" rx="12" fill="#F7F5F0" stroke="#D6D0C6"/>
<circle cx="30" cy="427.0" r="14" fill="#8B5CF6"/>
<text x="30" y="432.0" text-anchor="middle" font-family="Unbounded, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">5</text>
<text x="66" y="412" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#5B33C9" letter-spacing="0.5">ОГРАНИЧЕНИЯ<tspan fill="#8C8880" font-weight="400" letter-spacing="0"> · чего нельзя</tspan></text>
<text x="66" y="432" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#0F1112">Без «уникальный» и «лучший»,</text>
<text x="66" y="449" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#0F1112">не выдумывай цены и акции</text>
<rect x="12" y="478" width="336" height="60" rx="12" fill="#24124A"/>
<text x="28" y="502" font-family="Golos Text, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">= рабочий черновик за 1-2 захода</text>
<text x="28" y="522" font-family="Golos Text, Arial, sans-serif" font-size="12" fill="#D2C2FF">+ образец текста, если важен стиль</text>
</svg>

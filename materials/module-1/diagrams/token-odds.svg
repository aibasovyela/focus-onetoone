<text x="20" y="268" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="500" fill="#5B33C9" letter-spacing="0.5">ТРИ ПОПЫТКИ — РАЗНЫЕ ОТВЕТЫ</text>

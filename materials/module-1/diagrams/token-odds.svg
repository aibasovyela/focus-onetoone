<text x="294" y="320" font-family="Golos Text, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0F1112" text-anchor="middle">Перемена</text>
<rect x="12" y="350" width="336" height="60" rx="12" fill="#24124A"/>
<text x="26" y="375" font-family="Golos Text, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF">Модель тянет «жребий» среди вероятных.</text>
<text x="26" y="393" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#D2C2FF">Не зашло — жми «Сгенерировать заново».</text>

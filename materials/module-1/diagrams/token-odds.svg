<text x="20" y="22" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="500" fill="#5B33C9" letter-spacing="0.5">ЗАПРОС</text>
<rect x="59.0625" y="32" width="288.938" height="36" rx="14" fill="#8B5CF6"/>
<text x="203.531" y="55" font-family="Golos Text, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#FFFFFF" text-anchor="middle">Название для кофейни у вуза, одно слово</text>
<text x="20" y="98" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="500" fill="#5B33C9" letter-spacing="0.5">ШАНСЫ СЛЕДУЮЩЕГО СЛОВА</text>
<text x="340" y="98" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="500" fill="#8C8880" text-anchor="end" letter-spacing="0.5">УСЛОВНО</text>
<text x="20" y="124" font-family="Golos Text, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F1112">«Перемена»</text>

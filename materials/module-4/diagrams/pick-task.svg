<text x="180" y="161" font-family="Golos Text, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">первый</text>
<text x="180" y="177" font-family="Golos Text, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#D2C2FF" text-anchor="middle">агент</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 354" width="100%" role="img" aria-label="Три вопроса для выбора первой задачи агента">
<defs><marker id="a-pick" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#8B5CF6"/></marker></defs>
<g opacity="1"></g>
<circle cx="180" cy="92" r="82" fill="#D2C2FF" fill-opacity="0.45" stroke="#D2C2FF" stroke-width="1.5"/>
<circle cx="116" cy="192" r="82" fill="#FFB59A" fill-opacity="0.45" stroke="#FFB59A" stroke-width="1.5"/>

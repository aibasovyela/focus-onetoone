<text x="84" y="220" font-family="Golos Text, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#24124A" text-anchor="middle">Постоянно</text>
<text x="84" y="237" font-family="Golos Text, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#24124A" text-anchor="middle">откладываю</text>
<text x="276" y="220" font-family="Golos Text, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#24124A" text-anchor="middle">Теряю инфо:</text>

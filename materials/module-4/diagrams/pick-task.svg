<text x="26" y="315" font-family="Golos Text, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF">Задача во всех трёх ответах —</text>
<text x="26" y="333" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#D2C2FF">идеальная первая автоматизация</text>

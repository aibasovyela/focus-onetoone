<text x="30" y="244.5" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">15</text>
<text x="56" y="238" font-family="Golos Text, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F1112">Память</text>
<text x="56" y="255" font-family="Golos Text, Arial, sans-serif" font-size="12" fill="#45433F">о тебе и бизнесе, что помнить и что нет</text>

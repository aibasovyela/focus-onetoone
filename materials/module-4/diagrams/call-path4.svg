<text x="56" y="112" font-family="Golos Text, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F1112">Чат против агента</text>
<text x="56" y="129" font-family="Golos Text, Arial, sans-serif" font-size="12" fill="#45433F">роль, память, инструменты, расписание, канал</text>

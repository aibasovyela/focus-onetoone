<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 412" width="100%" role="img" aria-label="Опасные действия только после твоего «ок»">
<defs><marker id="a-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#8B5CF6"/></marker></defs>
<text x="20" y="22" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="500" fill="#5B33C9" letter-spacing="0.5">ПУТЬ ОПАСНОЙ ПРОСЬБЫ</text>
<rect x="12" y="34" width="336" height="40" rx="12" fill="#FFFFFF" stroke="#D6D0C6" stroke-width="1"/>
<text x="180" y="58.5" font-family="Golos Text, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F1112" text-anchor="middle">«Почисти папку с отчётами»</text>
<line x1="180" y1="76" x2="180" y2="88" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" marker-end="url(#a-ok)"/>

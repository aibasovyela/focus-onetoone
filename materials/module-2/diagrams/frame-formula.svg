<line x1="30" y1="90" x2="30" y2="426" stroke="#D2C2FF" stroke-width="3" stroke-linecap="round"/>
<rect x="52" y="68" width="296" height="46" rx="12" fill="#F7F5F0" stroke="#D6D0C6" stroke-width="1"/>
<circle cx="30" cy="90" r="13" fill="#8B5CF6"/>
<text x="30" y="94.5" font-family="Unbounded, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="64" y="87" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5B33C9" font-weight="600" letter-spacing="0.5">ОБЪЕКТ</text>
<text x="64" y="105" font-family="IBM Plex Mono, monospace" font-size="12" fill="#0F1112">iced latte, tall clear glass, 350 ml</text>
<rect x="52" y="124" width="296" height="46" rx="12" fill="#F7F5F0" stroke="#D6D0C6" stroke-width="1"/>
<circle cx="30" cy="146" r="13" fill="#8B5CF6"/>

<text x="64" y="273" font-family="IBM Plex Mono, monospace" font-size="12" fill="#0F1112">low morning sun from the right</text>
<rect x="52" y="292" width="296" height="46" rx="12" fill="#F7F5F0" stroke="#D6D0C6" stroke-width="1"/>
<circle cx="30" cy="314" r="13" fill="#8B5CF6"/>
<text x="30" y="318.5" font-family="Unbounded, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text x="64" y="311" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5B33C9" font-weight="600" letter-spacing="0.5">СТИЛЬ</text>
<text x="64" y="329" font-family="IBM Plex Mono, monospace" font-size="12" fill="#0F1112">35mm film, Kodak Portra 400</text>
<rect x="52" y="348" width="296" height="46" rx="12" fill="#F7F5F0" stroke="#D6D0C6" stroke-width="1"/>
<circle cx="30" cy="370" r="13" fill="#8B5CF6"/>

<text x="64" y="161" font-family="IBM Plex Mono, monospace" font-size="12" fill="#0F1112">milk slowly marbles into espresso</text>
<rect x="52" y="180" width="296" height="46" rx="12" fill="#F7F5F0" stroke="#D6D0C6" stroke-width="1"/>
<circle cx="30" cy="202" r="13" fill="#8B5CF6"/>

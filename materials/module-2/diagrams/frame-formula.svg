<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 484" width="100%" role="img" aria-label="Формула кадра из семи слоёв на примере айс-латте">
<text x="16" y="30" font-family="Unbounded, Arial, sans-serif" font-size="16" fill="#0F1112" font-weight="700">Формула кадра</text>

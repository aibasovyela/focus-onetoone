<text x="64" y="385" font-family="IBM Plex Mono, monospace" font-size="12" fill="#0F1112">85mm, f/2.8, medium close-up</text>
<rect x="52" y="404" width="296" height="46" rx="12" fill="#F7F5F0" stroke="#D6D0C6" stroke-width="1"/>
<circle cx="30" cy="426" r="13" fill="#8B5CF6"/>
<text x="30" y="430.5" font-family="Unbounded, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text>
<text x="64" y="423" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5B33C9" font-weight="600" letter-spacing="0.5">ДЕТАЛИ</text>
<text x="64" y="441" font-family="IBM Plex Mono, monospace" font-size="12" fill="#0F1112">condensation · NEGATIVE: steam</text>
<text x="16" y="472" font-family="Golos Text, Arial, sans-serif" font-size="12.5" fill="#45433F">Главное — в начале. Порядок всегда один.</text>

<text x="64" y="217" font-family="IBM Plex Mono, monospace" font-size="12" fill="#0F1112">pale marble counter, 8 am</text>
<rect x="52" y="236" width="296" height="46" rx="12" fill="#F7F5F0" stroke="#D6D0C6" stroke-width="1"/>
<circle cx="30" cy="258" r="13" fill="#8B5CF6"/>
